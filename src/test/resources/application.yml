spring:
  datasource:
    url: jdbc:h2:mem:gameop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-only-change-me-use-at-least-32-bytes!
    expiration-seconds: 86400

twitch:
  client-id: test-client
  client-secret: test-secret
  token-url: http://localhost/oauth2/token

igdb:
  base-url: http://localhost/igdb
  catalog-size: 500
  page-size: 500
  cache-ttl-minutes: 360
